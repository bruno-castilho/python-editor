name: E2E Server Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-server:
    name: Run E2E Server Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: python-editor
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailhog:
        image: mailhog/mailhog
        ports:
          - 1025:1025
          - 8025:8025

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/python-editor?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
      ACCESS_TOKEN_SECRET: test-access-secret
      REFRESH_TOKEN_SECRET: test-refresh-secret
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@test.com
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: admin
      STORAGE_SECRET_ACCESS_KEY: password
      STORAGE_BUCKET: avatars
      STORAGE_PUBLIC_URL: http://localhost:9000/avatars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start MinIO
        run: |
          docker run -d \
            --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=admin \
            -e MINIO_ROOT_PASSWORD=password \
            minio/minio server /data --console-address ":9001"

      - name: Wait for MinIO and create bucket
        run: |
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set local http://localhost:9000 admin password
          mc mb local/avatars

      - name: Create server environment file for CI
        working-directory: apps/server
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:password@localhost:5432/python-editor?schema=public
          REDIS_URL=redis://localhost:6379
          NODE_ENV=test
          PORT=3000
          CORS_ORIGIN=http://localhost:3001
          ACCESS_TOKEN_SECRET=test-access-secret
          REFRESH_TOKEN_SECRET=test-refresh-secret
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_FROM=noreply@test.com
          STORAGE_ENDPOINT=http://localhost:9000
          STORAGE_REGION=us-east-1
          STORAGE_ACCESS_KEY_ID=admin
          STORAGE_SECRET_ACCESS_KEY=password
          STORAGE_BUCKET=avatars
          STORAGE_PUBLIC_URL=http://localhost:9000/avatars
          EOF

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run E2E server tests
        run: npm run test:e2e:server
